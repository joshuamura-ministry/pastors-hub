# Terrain on Netlify. This file overrides the same settings in the Netlify dashboard.
# Never put a secret value here. Secrets stay in Netlify > Project configuration > Environment variables.

[build]
  # Make a clean folder holding only what visitors need: the app page, the idea library, the connection-card fonts and the
  # conference calendars ("Learn from other conferences": conferences/, built by tools/conferences/build.mjs; its source,
  # tools/conferences/src, is never copied), and tr-here.png (v10.59.0: the 3×2 picture pastorshub.org looks for at terrain.church before it
  # carries a device's saved work there), and (v10.68.0) the app icon: icons/, favicon.ico and apple-touch-icon.png at the root (browsers ask
  # there by themselves), manifest.webmanifest (the name and icons a phone or computer gives Terrain when it is added). If any copy fails, the deploy fails and the live site stays exactly as it was.
  command = "rm -rf site && mkdir site && cp index.html site/ && cp -R ideas site/ && cp -R fonts site/ && cp -R conferences site/ && cp tr-here.png site/ && cp privacy.html terms.html refunds.html about.html site/ && cp -R icons site/ && cp manifest.webmanifest favicon.ico apple-touch-icon.png site/"
  publish = "site"

  # Skip a LIVE deploy only when every change since the last live build is inside tests/, tools/,
  # .github/, .gitignore, a .md file, or FIREBASE-RULES-TERRAIN.txt. Anything else builds.
  # It never skips pull-request previews, first or "Clear cache and deploy" builds, build hooks,
  # or any case where git cannot answer. Exit 0 = skip; any other exit code = build.
  ignore = '[ "$PULL_REQUEST" = "false" ] && [ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ":(exclude)tests" ":(exclude)tools" ":(exclude)*.md" ":(exclude)FIREBASE-RULES-TERRAIN.txt" ":(exclude).github" ":(exclude).gitignore"'

# v10.62.1: the public pages, each at its own short address: the privacy policy (Meta's App Review and Stripe ask for it), the terms of
# service, the refund policy, and what Terrain is with its plans (a payment provider expects one public page that says what is sold)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/refunds"
  to = "/refunds.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200


[functions]
  # The server programs, same place as today: advise, census, gifts, present, register, and the two daily sweeps.
  directory = "netlify/functions"

# Safe browser headers for every page and file (they do not apply to function replies).
# No script rules on purpose: the app's inline code and its map, census and font hosts keep working.
# v10.68.0: the manifest under its own type (the headers below say nosniff)
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)"
